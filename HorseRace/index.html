<!DOCTYPE html>
<html>
    <head>
        <title>Horse Racing</title>
        <script src="scripts/utils.js"></script>
        <script src="scripts/data.js"></script>
        <script src="scripts/settings.js"></script>
        <script src="scripts/horse.js"></script>
        <script src="scripts/race.js"></script>
        <script src="scripts/script.js"></script>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body onload="init()">
        <div id="raceTab">
            <div id="container">
                <table id="currentRace">
                    <thead>
                        <tr>
                            <th>Num</th>
                            <th>Name</th>
                            <th>Decimal Odds</th>
                            <th>Odds</th>
                            <th>Placement</th>
                        </tr>
                    </thead>
                    <tbody id="currentRaceTableContent">
                    </tbody>
                </table>
                <div id="controlContainer">
                    <button id="generateRaceBtn" onclick="generateRace()">Generate Race</button>
                    <button id="nextRaceBtn" onclick="next()">Next Race</button>
                </div>    
                <table id="nextRace">
                    <thead>
                        <tr>
                            <th>Num</th>
                            <th>Name</th>
                            <th>Decimal Odds</th>
                            <th>Odds</th>
                        </tr>
                    </thead>
                    <tbody id="nextRaceTableContent">
                    </tbody>
                </table>
                
                <canvas id="canvas" width="1040" height="360"></canvas>
            </div>
            <button onclick="executeTurn()">Race Turn</button>
            <button onclick="autoRace()">Auto Race</button>
            <button onclick="stopRace()">Stop Race</button>
        </div>
        <div id="settingsTab">
            <div id="diceEnableDiv"></div>
            <label for="distanceSelect">Distance</label>
            <select id="distanceSelect">
                <option value="50">50</option>
            </select>
            <label for="participantInput">Participants</label>
            <input id="participantInput" type="number" min="2" max="8"/>
            <label for="houseCutInput">House Cut</label>
            <input id="houseCutInput" type="number" min="0" max="99"/>
            <label for="turnTimerInput">Turn Timer (ms)</label>
            <input id="turnTimerInput" type="number" min="1" max="5000"/>
            <button onclick="save()">Save Settings</button>
        </div>
        </body>
</html>
